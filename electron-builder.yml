appId: com.deepseek.dshdesktop
productName: DeepSeek Harness
copyright: MIT

directories:
  output: dist-installer

files:
  - dist/**
  - package.json
  # node_modules intentionally NOT globbed here. electron-builder collects the
  # production dependency tree automatically from package.json `dependencies`
  # (registry, scoped, and file: preset plugins included) and never ships
  # devDependencies. A raw `node_modules/**` glob would bypass that filter and
  # bloat the installer with build-only tooling (electron ~352M, typescript,
  # electron-builder, vitepress/vitest/vue, etc.). asarUnpack below still applies
  # to the auto-collected production node_modules so the spawned dsh subprocess
  # can execute unpacked entry paths.

# The dsh CLI entry is spawned as a child process; asar archives are not
# executable paths, so the runtime tree must stay on disk.
asarUnpack:
  - node_modules/**

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip # required by electron-updater on macOS
  # No ${productName} here: the space in "DSH Desktop" makes electron-builder
  # write a dashed safeArtifactName into latest-mac.yml while gh release upload
  # turns the space into a dot — the updater's download URL then 404s.
  artifactName: DeepSeek-Harness-${version}-mac-arm64.${ext}

win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: DeepSeek-Harness-${version}-win-x64-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DeepSeek Harness

publish:
  provider: github
  owner: deepseekhar
  repo: dsh-desktop-unified
