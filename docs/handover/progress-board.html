<body>
<div class="wrap">
  <div class="page-head">
    <div class="logo">D</div>
    <div>
      <h1>DeepSeek Harness 桌面壳 · 项目进度看板</h1>
      <p>弥合竞品差距计划（Phase 1–7）· 轻量工作项管理 · 数据存于本地浏览器</p>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-view="table">工作项列表</div>
    <div class="tab" data-view="board">看板视图</div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <select id="filter-status"><option value="">全部状态</option></select>
    <select id="filter-priority"><option value="">全部优先级</option></select>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      <input id="search" placeholder="搜索名称…" />
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btn-new">+ 新建工作项</button>
  </div>

  <div class="card" id="view-table">
    <table>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="board hidden" id="view-board"></div>

  <div class="note">说明：这是一个单文件看板，数据保存在<b>当前浏览器的本地缓存</b>里——换一台电脑、换个浏览器、或者清理了浏览记录，之前填的就没了。它只适合你自己一个人看进度；如果要多个人共享同一个看板，这一版做不到。</div>
</div>

<script>
/* ============================================================
   CONFIG — 数据定制区（本看板已预置 DeepSeek Harness 桌面壳
   「弥合竞品差距」计划 Phase 1-7 的真实任务与状态）
   ============================================================ */
const CONFIG = {
  storageKey: "dsh-desktop-pm-board-v1",   // localStorage bucket; bump to reset

  // status options double as kanban columns (order = column order)
  statuses: [
    { key: "todo",    label: "待开始", color: "#fef0f0", text: "#f56c6c" },
    { key: "doing",   label: "开发中", color: "#e8f8f2", text: "#0fbf8f" },
    { key: "review",  label: "待评审", color: "#eaf0ff", text: "#4b63ff" },
    { key: "done",    label: "已完成", color: "#eef0f5", text: "#86909c" },
  ],

  priorities: [
    { key: "P0", color: "#fde2e2", text: "#f53f3f" },
    { key: "P1", color: "#fff1e0", text: "#f77234" },
    { key: "P2", color: "#f0eafe", text: "#7a5af5" },
  ],

  // columns shown in the table view; `key` maps to item field
  columns: [
    { key: "name",     label: "工作项" },
    { key: "phase",    label: "阶段" },
    { key: "status",   label: "状态",   type: "status" },
    { key: "priority", label: "优先级", type: "priority" },
    { key: "owner",    label: "负责人" },
    { key: "created",  label: "日期" },
  ],

  // 预置数据：仅当浏览器本地缓存为空时使用（首开即见此表；之后在 UI 里增删改）
  seed: [
    { id: 1,  name: "插件保护中心：装前快照 + 失败自动回滚", phase: "P1", status: "done",   owner: "foolgry+", priority: "P0", created: "2026-08-31" },
    { id: 2,  name: "dsh 0.1.2-alpha 升级 + preset-transfer 启用", phase: "P2", status: "done", owner: "foolgry+", priority: "P0", created: "2026-08-31" },
    { id: 3,  name: "CI 测试门 + 平台架构校验", phase: "P3", status: "done", owner: "foolgry+", priority: "P1", created: "2026-08-31" },
    { id: 4,  name: "多 profile 档案隔离（web-desktop）", phase: "P4", status: "done", owner: "foolgry+", priority: "P1", created: "2026-08-31" },
    { id: 5,  name: "会话内终端（dsh-terminal 插件）", phase: "P5", status: "done", owner: "foolgry+", priority: "P1", created: "2026-08-31" },
    { id: 6,  name: "内置主题 dsh-theme + 版权署名面板", phase: "P6", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 7,  name: "会话完成系统通知（session-notifier）", phase: "P6", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 8,  name: "自动压缩评估：dsh-auto-compact 不在 npm → 预置 compact-after-task", phase: "P6", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 9,  name: "余额小部件：预置 dsh-api-balance / dsh-cost-meter", phase: "P6", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 10, name: "评估项决策记录（签名/体积/手机远程）", phase: "P7", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 11, name: "端到端实跑验证 Phase 5/6（终端/主题/通知/余额）", phase: "收尾", status: "done", owner: "foolgry+", priority: "P1", created: "2026-08-31" },
    { id: 12, name: "HANDOVER 补 Phase 5/6 执行状态小节", phase: "收尾", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 13, name: "计划文档 Phase 1-3 checkbox 补勾（37 处）", phase: "收尾", status: "done", owner: "foolgry+", priority: "P2", created: "2026-08-31" },
    { id: 14, name: "GitHub 远程仓库推送（docs/ 移进内层仓库）", phase: "发布", status: "todo", owner: "用户拍板", priority: "P1", created: "2026-08-31" },
  ],

  // top stat cards; `calc` receives all items and returns a number/string
  stats: [
    { label: "总工作项",   calc: items => items.length },
    { label: "已完成",     calc: items => items.filter(i => i.status === "done").length },
    { label: "进行中",     calc: items => items.filter(i => i.status === "doing").length },
    { label: "待办",       calc: items => items.filter(i => i.status === "todo").length },
  ],
};

/* ============================================================
   ENGINE — usually no need to edit below this line.
   ============================================================ */
const store = {
  load() {
    const raw = localStorage.getItem(CONFIG.storageKey);
    if (raw) { try { return JSON.parse(raw); } catch (e) {} }
    return structuredClone(CONFIG.seed);
  },
  save(items) { localStorage.setItem(CONFIG.storageKey, JSON.stringify(items)); },
};

let items = store.load();
let currentView = "table";

const $ = sel => document.querySelector(sel);
const statusOf = k => CONFIG.statuses.find(s => s.key === k) || { label: k, color: "#eee", text: "#333" };
const prioOf = k => CONFIG.priorities.find(p => p.key === k) || { key: k, color: "#eee", text: "#333" };

function filtered() {
  const s = $("#filter-status").value, p = $("#filter-priority").value, q = $("#search").value.trim().toLowerCase();
  return items.filter(i =>
    (!s || i.status === s) && (!p || i.priority === p) && (!q || (i.name || "").toLowerCase().includes(q))
  );
}

function renderStats() {
  $("#stats").innerHTML = CONFIG.stats.map(s =>
    `<div class="stat"><div class="label">${s.label}</div><div class="value">${s.calc(items)}</div></div>`
  ).join("");
}

function cell(item, col) {
  const v = item[col.key] ?? "";
  if (col.type === "status") { const s = statusOf(v); return `<span class="badge" style="background:${s.color};color:${s.text}"><span class="dot"></span>${s.label}</span>`; }
  if (col.type === "priority") { const p = prioOf(v); return `<span class="badge" style="background:${p.color};color:${p.text}">${p.key}</span>`; }
  return v;
}

const TRASH_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><line x1="10" y1="10" x2="10" y2="17"/><line x1="14" y1="10" x2="14" y2="17"/></svg>`;

function renderTable() {
  $("#thead-row").innerHTML = CONFIG.columns.map(c => `<th>${c.label}</th>`).join("") + `<th class="col-actions">操作</th>`;
  $("#tbody").innerHTML = filtered().map(item =>
    `<tr data-id="${item.id}">` +
    CONFIG.columns.map(c => `<td class="${c.key === "name" ? "name" : ""}">${cell(item, c)}</td>`).join("") +
    `<td class="col-actions"><button class="icon-btn js-del" title="删除">${TRASH_SVG}</button></td>` +
    `</tr>`
  ).join("");
  $("#tbody").querySelectorAll("td.name").forEach(td =>
    td.onclick = () => openModal(items.find(i => i.id == td.parentElement.dataset.id)));
  $("#tbody").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest("tr").dataset.id)); });
}

function renderBoard() {
  const data = filtered();
  $("#view-board").innerHTML = CONFIG.statuses.map(s => {
    const list = data.filter(i => i.status === s.key);
    return `<div class="col" data-status="${s.key}">
      <h3>${s.label}<span class="count">${list.length}</span></h3>
      <div class="col-body">${list.map(ticketHTML).join("")}</div>
    </div>`;
  }).join("");
  wireDnD();
}

function ticketHTML(item) {
  const p = prioOf(item.priority);
  return `<div class="ticket" draggable="true" data-id="${item.id}">
    <button class="icon-btn js-del t-del" title="删除">${TRASH_SVG}</button>
    <div class="t-name">${item.name}</div>
    <div class="t-meta">
      <span class="badge" style="background:${p.color};color:${p.text}">${p.key}</span>
      <span>${item.phase || ""}</span>
      <span>${item.owner || "暂无"}</span>
    </div></div>`;
}

function wireDnD() {
  let dragId = null;
  $("#view-board").querySelectorAll(".ticket").forEach(t => {
    t.ondragstart = () => { dragId = t.dataset.id; t.classList.add("dragging"); };
    t.ondragend = () => t.classList.remove("dragging");
    t.onclick = () => openModal(items.find(i => i.id == t.dataset.id));
  });
  $("#view-board").querySelectorAll(".js-del").forEach(btn =>
    btn.onclick = e => { e.stopPropagation(); confirmDelete(items.find(i => i.id == btn.closest(".ticket").dataset.id)); });
  $("#view-board").querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop-hover"); };
    col.ondragleave = () => col.classList.remove("drop-hover");
    col.ondrop = () => {
      col.classList.remove("drop-hover");
      const item = items.find(i => i.id == dragId);
      if (item) { item.status = col.dataset.status; persist(); }
    };
  });
}

function render() {
  renderStats();
  $("#view-table").classList.toggle("hidden", currentView !== "table");
  $("#view-board").classList.toggle("hidden", currentView !== "board");
  currentView === "table" ? renderTable() : renderBoard();
}
function persist() { store.save(items); render(); }

/* ---- editor modal ---- */
function openModal(item) {
  const editing = !!item;
  const d = item || { id: Date.now(), name: "", phase: "", status: CONFIG.statuses[0].key, owner: "", priority: CONFIG.priorities.at(-1).key, created: new Date().toISOString().slice(0, 10) };
  const opts = (arr, sel, lab = x => x.label || x.key, val = x => x.key) =>
    arr.map(x => `<option value="${val(x)}" ${val(x) === sel ? "selected" : ""}>${lab(x)}</option>`).join("");
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal">
    <h2>${editing ? "编辑工作项" : "新建工作项"}</h2>
    <div class="sub">${editing ? "修改后点击保存生效" : "填写信息创建一条新的工作项"}</div>
    <div class="field"><label>名称</label><input id="m-name" value="${d.name}" placeholder="输入工作项名称" /></div>
    <div class="field"><label>阶段</label><input id="m-phase" value="${d.phase || ""}" placeholder="如 P1 / P2 / 收尾 / 发布" /></div>
    <div class="field"><label>负责人</label><input id="m-owner" value="${d.owner}" placeholder="输入负责人" /></div>
    <div class="field"><label>状态</label><select id="m-status">${opts(CONFIG.statuses, d.status)}</select></div>
    <div class="field"><label>优先级</label><select id="m-priority">${opts(CONFIG.priorities, d.priority)}</select></div>
    <div class="modal-actions">
      ${editing ? '<button class="link-danger" id="m-del">删除</button>' : ""}
      <div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button>
      <button class="btn" id="m-save">保存</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#m-cancel").onclick = close;
  overlay.querySelector("#m-save").onclick = () => {
    d.name = overlay.querySelector("#m-name").value.trim() || "未命名";
    d.phase = overlay.querySelector("#m-phase").value.trim();
    d.owner = overlay.querySelector("#m-owner").value.trim();
    d.status = overlay.querySelector("#m-status").value;
    d.priority = overlay.querySelector("#m-priority").value;
    if (!editing) items.unshift(d);
    persist(); close();
  };
  if (editing) overlay.querySelector("#m-del").onclick = () => { close(); confirmDelete(d); };
}

/* ---- delete confirmation ---- */
function confirmDelete(item) {
  if (!item) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="modal" style="width:380px">
    <h2>删除工作项</h2>
    <div class="sub">确定删除「${item.name}」？此操作不可撤销。</div>
    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">取消</button>
      <button class="btn danger" id="c-ok">删除</button>
    </div></div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector("#c-cancel").onclick = close;
  overlay.querySelector("#c-ok").onclick = () => { items = items.filter(i => i.id !== item.id); persist(); close(); };
}

/* ---- wire controls ---- */
function initFilters() {
  $("#filter-status").insertAdjacentHTML("beforeend", CONFIG.statuses.map(s => `<option value="${s.key}">${s.label}</option>`).join(""));
  $("#filter-priority").insertAdjacentHTML("beforeend", CONFIG.priorities.map(p => `<option value="${p.key}">${p.key}</option>`).join(""));
}
document.querySelectorAll(".tab").forEach(tab =>
  tab.onclick = () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentView = tab.dataset.view;
    render();
  });
["#filter-status", "#filter-priority", "#search"].forEach(sel => $(sel).oninput = render);
$("#btn-new").onclick = () => openModal(null);

initFilters();
render();
</script>
</body>
</html>
